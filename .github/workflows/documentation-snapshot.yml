name: Documentation PDF snapshot

on:
  workflow_dispatch:
  push:
    tags:
      - "docs-v*"

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the documentation source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/requirements.txt

      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes latexmk texlive-fonts-recommended texlive-latex-extra texlive-latex-recommended

      - name: Validate documentation
        run: make docs-check

      - name: Build PDF snapshot
        run: make docs-pdf

      - name: Upload controlled snapshot and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: good-developer-portal-pdf-${{ github.sha }}
          path: |
            build/latex/GOOD-Developer-Portal.pdf
            build/build-manifest.json
          if-no-files-found: error
          retention-days: 90
