name: Documentation validation

on:
  pull_request:
    paths:
      - "docs/**"
      - "tools/**"
      - ".github/workflows/documentation.yml"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/**"
      - ".github/workflows/documentation.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the documentation source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/requirements.txt

      - name: Validate and build the developer portal
        run: make docs-check

      - name: Confirm generated source inventory is committed
        run: git diff --exit-code -- docs/reference/source-registry.md

      - name: Upload portal preview and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: good-developer-portal-${{ github.sha }}
          path: |
            build/html
            build/build-manifest.json
          if-no-files-found: error
          retention-days: 14
